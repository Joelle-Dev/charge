name: Deploy to GitHub Pages

on:
  workflow_dispatch:

# 默认与 punch 一致：使用 docs 目录做分支部署。
# 如改用 GitHub Actions 部署，请取消下面注释，并在仓库设置中把 Pages Source 改为 GitHub Actions。
#  push:
#    branches:
#      - main
#      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_APP_START_URL: /${{ github.event.repository.name }}/
          VITE_APP_SCOPE: /${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
