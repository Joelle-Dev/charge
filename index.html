  <style>
    html, body {
      margin: 0;
      background: #faf5ec;
    }
    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(600px 420px at 50% 35%, #fffaf3 0%, rgba(255, 250, 243, 0) 70%),
        #faf5ec;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .splash-screen.is-hidden {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }
    .splash-mark {
      position: relative;
      display: block;
      width: 88px;
      height: 88px;
      animation: splash-pop 0.6s cubic-bezier(0.2, 0.9, 0.25, 1.1) both;
    }
    .splash-mark::before {
      content: "";
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(233, 149, 141, 0.16) 0%, rgba(233, 149, 141, 0) 70%);
      animation: splash-halo 3s ease-in-out infinite;
    }
    .splash-mark img {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(90, 63, 43, 0.12));
    }
    .splash-title {
      display: flex;
      gap: 0.14em;
      margin-top: 18px;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: #2d2723;
    }
    .splash-char {
      display: inline-block;
      animation: splash-char 0.5s cubic-bezier(0.2, 0.85, 0.25, 1.2) both;
    }
    .splash-char:nth-child(1) { animation-delay: 0.1s; }
    .splash-char:nth-child(2) { animation-delay: 0.17s; }
    .splash-char:nth-child(3) { animation-delay: 0.24s; }
    .splash-char:nth-child(4) { animation-delay: 0.31s; }
    .splash-subtitle {
      min-height: 17px;
      margin-top: 10px;
      font-size: 11.5px;
      letter-spacing: 0.06em;
      color: #9a8b7e;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .splash-subtitle.is-swap {
      opacity: 0;
      transform: translateY(4px);
    }
    .splash-progress {
      position: relative;
      width: 96px;
      height: 3px;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(233, 149, 141, 0.18);
    }
    .splash-progress::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40%;
      border-radius: inherit;
      background: #e9958d;
      animation: splash-progress 1.5s ease-in-out infinite;
    }
    @keyframes splash-pop {
      0% { opacity: 1; transform: translateY(0) scale(0.985); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes splash-halo {
      0%, 100% { opacity: 0.6; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.04); }
    }
    @keyframes splash-char {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes splash-progress {
      0% { left: -40%; }
      100% { left: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-screen *,
      .splash-screen *::before,
      .splash-screen *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="splash" class="splash-screen">
    <div class="splash-mark" aria-hidden="true">
      <img src="./icons/cat-transparent.png" alt="">
    </div>
    <div class="splash-title" aria-label="守财小果">
      <span class="splash-char">守</span><span class="splash-char">财</span><span class="splash-char">小</span><span class="splash-char">果</span>
    </div>
    <div class="splash-subtitle" id="splashSubtitle">说一句就记上</div>
    <div class="splash-progress" aria-hidden="true"></div>
  </div>
  <script>
    (function () {
      var lines = ['说一句就记上', '果冻把账本准备好啦', '今天也要好好记账'];
      var index = 0;
      var el = document.getElementById('splashSubtitle');
      if (!el) return;
      window.setInterval(function () {
        el.classList.add('is-swap');
        window.setTimeout(function () {
          index = (index + 1) % lines.length;
          el.textContent = lines[index];
          el.classList.remove('is-swap');
        }, 180);
      }, 1300);
    })();
  </script>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
